<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Unity Web Player | Fps shooters</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #unity-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #000;
      }
      #loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #000;
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
        z-index: 10;
        transition: opacity 0.4s ease;
      }
      #loader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(255, 255, 255, 0.2);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      #loader-bar {
        width: 240px;
        height: 4px;
        margin-top: 24px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 2px;
        overflow: hidden;
      }
      #loader-bar-fill {
        width: 0%;
        height: 100%;
        background: #fff;
        transition: width 0.15s ease;
      }
      #loader-text {
        margin-top: 12px;
        font-size: 14px;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>
    <div id="loader">
      <div class="spinner"></div>
      <div id="loader-bar"><div id="loader-bar-fill"></div></div>
      <div id="loader-text">Loading... 0%</div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loader = document.querySelector("#loader");
      var barFill = document.querySelector("#loader-bar-fill");
      var loaderText = document.querySelector("#loader-text");

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/fps for unblocked games.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/fps for unblocked games.data",
        frameworkUrl: buildUrl + "/fps for unblocked games.framework.js",
        codeUrl: buildUrl + "/fps for unblocked games.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "ZH games",
        productName: "Fps shooters",
        productVersion: "5.0.8",
        showBanner: function (msg, type) {
          if (type == 'error') console.error(msg);
        },
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          var pct = Math.round(progress * 100);
          barFill.style.width = pct + "%";
          loaderText.textContent = "Loading... " + pct + "%";
        }).then(() => {
          loader.classList.add("hidden");
          setTimeout(function () { loader.style.display = "none"; }, 500);
        }).catch((message) => {
          console.error(message);
          loaderText.textContent = "Failed to load the game.";
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
